                    <div v-if="currentTab === 'apps'" class="space-y-5 max-w-7xl mx-auto">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div>
                                <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-white">Kho Ứng Dụng (App Store)</h2>
                                <p class="text-[12px] text-slate-500 dark:text-slate-400">Cài đặt 1-Click các dịch vụ máy chủ, cơ sở dữ liệu, PHP và công cụ bảo mật chuẩn WPC</p>
                            </div>
                            <div class="flex items-center space-x-2 text-[11.5px]">
                                <span class="px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-medium">
                                    Đã cài: <b class="text-emerald-400 font-bold">{{ installedAppsCount }}</b> / {{ appsList.length }} ứng dụng
                                </span>
                                <button @click="fetchAppsList" class="p-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition" title="Làm mới trạng thái">
                                    🔄
                                </button>
                            </div>
                        </div>

                        <!-- Category Filter Tabs -->
                        <div class="flex flex-wrap gap-1.5 border-b border-slate-200 dark:border-slate-800 pb-2.5 text-[12px]">
                            <button @click="appsCategory = 'all'"
                                :class="appsCategory === 'all' ? 'px-3 py-1 rounded-lg bg-blue-600 text-white font-medium shadow-sm' : 'px-3 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'">
                                Tất Cả ({{ appsList.length }})
                            </button>
                            <button @click="appsCategory = 'webserver'"
                                :class="appsCategory === 'webserver' ? 'px-3 py-1 rounded-lg bg-blue-600 text-white font-medium shadow-sm' : 'px-3 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'">
                                Web Server
                            </button>
                            <button @click="appsCategory = 'database'"
                                :class="appsCategory === 'database' ? 'px-3 py-1 rounded-lg bg-blue-600 text-white font-medium shadow-sm' : 'px-3 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'">
                                Database
                            </button>
                            <button @click="appsCategory = 'php'"
                                :class="appsCategory === 'php' ? 'px-3 py-1 rounded-lg bg-blue-600 text-white font-medium shadow-sm' : 'px-3 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'">
                                PHP Runtime
                            </button>
                            <button @click="appsCategory = 'tools'"
                                :class="appsCategory === 'tools' ? 'px-3 py-1 rounded-lg bg-blue-600 text-white font-medium shadow-sm' : 'px-3 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'">
                                Công Cụ & Bảo Mật
                            </button>
                        </div>

                        <!-- Danh Sách Apps Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div v-for="app in filteredApps" :key="app.id"
                                class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200/90 dark:border-slate-800 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-3.5">
                                <div>
                                    <!-- Top Card Header -->
                                    <div class="flex justify-between items-start mb-2.5">
                                        <div class="w-10 h-10 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 flex items-center justify-center text-xl shadow-inner">
                                            {{ app.icon }}
                                        </div>
                                        <div class="flex flex-col items-end">
                                            <span v-if="app.running" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1.5">
                                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                                <span>Đang Chạy</span>
                                            </span>
                                            <span v-else-if="app.installed" class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">
                                                Đã Dừng
                                            </span>
                                            <span v-else class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600 border border-slate-200">
                                                Chưa Cài Đặt
                                            </span>
                                        </div>
                                    </div>

                                    <!-- App Title & Version -->
                                    <div class="flex items-center space-x-1.5">
                                        <h4 class="font-bold text-slate-800 dark:text-slate-100 text-[13.5px]">{{ app.name }}</h4>
                                        <span class="text-[11px] text-slate-400 font-medium">v{{ app.default_version }}</span>
                                    </div>
                                    <p class="text-[11.5px] text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">{{ app.desc }}</p>
                                </div>

                                <!-- Action Buttons & Version Selector -->
                                <div class="pt-2.5 border-t border-slate-100 dark:border-slate-800 flex flex-col space-y-2 text-xs">
                                    <!-- Dropdown Chọn Phiên Bản (nếu chưa cài đặt và có nhiều options) -->
                                    <div v-if="!app.installed && app.versions && app.versions.length > 0" class="w-full">
                                        <label class="block text-[11px] text-slate-500 dark:text-slate-400 mb-1 font-medium">Chọn phiên bản:</label>
                                        <select v-model="appVersions[app.id]"
                                            class="w-full px-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 font-sans text-[12px] focus:outline-none focus:border-blue-500 focus:bg-white transition">
                                            <option v-for="v in app.versions" :key="v.value" :value="v.value" class="py-1">
                                                {{ v.label }}
                                            </option>
                                        </select>
                                    </div>

                                    <div v-if="!app.installed" class="w-full">
                                        <button @click="handleAppAction(app.id, 'install')"
                                            :disabled="installingAppId === app.id"
                                            class="w-full py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-500 font-medium text-xs text-white shadow-sm transition flex items-center justify-center space-x-1.5">
                                            <span v-if="installingAppId === app.id" class="animate-spin">⏳</span>
                                            <span v-else>⚡</span>
                                            <span>{{ installingAppId === app.id ? 'Đang gửi lệnh...' : 'Cài Đặt (1-Click)' }}</span>
                                        </button>
                                    </div>

                                    <div v-else class="space-y-2">
                                        <!-- Hàng 1: Nút Setting & Tự khởi động -->
                                        <div class="flex items-center justify-between gap-2">
                                            <button @click="openAppSettings(app)"
                                                class="flex-1 py-1.5 px-2.5 rounded-xl bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 transition flex items-center justify-center space-x-1.5 font-medium text-xs">
                                                <span>⚙️</span>
                                                <span>Cài Đặt (Setting)</span>
                                            </button>
                                            
                                            <!-- Checkbox Tự khởi động lại khi bị tắt -->
                                            <label v-if="app.service" class="flex items-center space-x-1.5 text-[11px] text-slate-600 cursor-pointer select-none bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100">
                                                <input type="checkbox" :checked="app.autorestart" @change="toggleAppAutorestart(app, $event.target.checked)"
                                                    class="rounded border-slate-300 text-blue-600 focus:ring-0">
                                                <span>Tự khởi động</span>
                                            </label>
                                        </div>

                                        <!-- Hàng 2: Bật / Tắt / Restart / Gỡ cài đặt -->
                                        <div class="w-full flex items-center justify-between gap-2 pt-0.5">
                                            <button v-if="app.service" @click="handleAppAction(app.id, 'restart')"
                                                class="flex-1 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium transition text-[11px] border border-slate-200">
                                                Khởi động lại
                                            </button>
                                            <button v-if="app.service" @click="handleAppAction(app.id, app.running ? 'stop' : 'start')"
                                                class="flex-1 py-1.5 rounded-xl transition text-[11px] font-semibold"
                                                :class="app.running ? 'bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200'">
                                                {{ app.running ? 'Dừng' : 'Bật' }}
                                            </button>
                                            <button @click="handleAppAction(app.id, 'uninstall')"
                                                class="px-3 py-1.5 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 transition text-[11px]"
                                                title="Gỡ cài đặt">
                                                🗑️
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
