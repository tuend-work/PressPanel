                                    <input type="password" v-model="editingCustomer.password" placeholder="Nhập mật khẩu mới nếu cần đổi..."
                                        class="w-full max-w-sm px-3 py-1.5 rounded bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-amber-400">
                                </div>
                            </div>
                        </div>

                        <!-- Footer Save Bar -->
                        <div class="flex justify-end gap-3 pt-2">
                            <button type="button" @click="closeUserEditor"
                                class="px-5 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold transition">
                                Hủy
                            </button>
                            <button type="submit" :disabled="savingCustomerEdit"
                                class="px-6 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold shadow transition">
                                {{ savingCustomerEdit ? 'Đang Lưu...' : 'Lưu Modify User' }}
                            </button>
                        </div>
                    </form>
                </div>
