<div v-if="currentTab === 'domains'" class="space-y-4 max-w-7xl mx-auto">
                    <!-- ========================================================================= -->
                    <!-- PHẦN 1: GIAO DIỆN DÀNH CHO ADMIN VÀ HOSTING USER (DẠNG CLEAN TABLE LIST)  -->
                    <!-- ========================================================================= -->
                    <template v-if="!isWebUser">
<!-- Top Navigation Tabs (Phong cách dự án 1Panel/aaPanel như ảnh tham chiếu) -->
                        <div class="flex items-center space-x-6 border-b border-slate-800/80 px-1 text-xs font-semibold overflow-x-auto">
                            <button @click="domainCategoryFilter = 'all'"
                                :class="domainCategoryFilter === 'all' ? 'text-emerald-500 border-b-2 border-blue-500 pb-2.5 font-bold' : 'text-slate-400 hover:text-slate-200 pb-2.5'"
                                class="transition whitespace-nowrap">
                                PHP Project
                            </button>

                            <button @click="showComingSoonModal('Node.js Project')"
                                class="text-slate-500 hover:text-slate-300 pb-2.5 transition whitespace-nowrap">
                                Node.js Project
                            </button>
                            <button @click="showComingSoonModal('Proxy Project')"
                                class="text-slate-500 hover:text-slate-300 pb-2.5 transition whitespace-nowrap">
                                Proxy Project
                            </button>
                            <button @click="showComingSoonModal('Go Project')"
                                class="text-slate-500 hover:text-slate-300 pb-2.5 transition whitespace-nowrap">
                                Go Project
                            </button>
                            <button @click="showComingSoonModal('Python Project')"
                                class="text-slate-500 hover:text-slate-300 pb-2.5 transition whitespace-nowrap">
                                Python Project
                            </button>
                            <button @click="domainCategoryFilter = 'system'; fetchDomains();"
                                :class="domainCategoryFilter === 'system' ? 'text-emerald-500 border-b-2 border-blue-500 pb-2.5 font-bold' : 'text-slate-500 hover:text-slate-300 pb-2.5'"
                                class="transition whitespace-nowrap flex items-center gap-1.5">
                                <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400 mr-1"></i><span>App Hệ Thống</span>
                                <span class="px-1.5 py-0.2 rounded-full text-[10px] bg-emerald-500/10 text-emerald-400 font-bold font-mono">{{ domains.filter(d => d.is_system === 1 || d.is_system === true).length }}</span>
                            </button>
                        </div>

                        <div class="space-y-4">
                        <!-- Clean Toolbar (Buttons + Filters + Search Box) -->
                        <div class="flex flex-wrap items-center justify-between gap-3 p-3 rounded-2xl bg-slate-900/60 border border-slate-800/80 shadow-sm">
                            <div class="flex flex-wrap items-center gap-2">
                                <!-- Nút Add Site màu xanh lá đặc trưng -->
                                <button v-if="(currentUser.role === 'reseller' || isHostingUser) && !isWebUser" @click="showAddDomainModal = true"
                                    class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 font-medium text-xs text-white shadow-sm transition flex items-center space-x-1.5">
                                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i><span>Thêm Website</span>
                                </button>
                                <button v-if="currentUser.role === 'admin'" @click="showAddCustomerModal = true; fetchServicePlans();"
                                    class="px-3.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 font-medium text-xs text-white shadow-sm transition flex items-center space-x-1.5">
                                    <i data-lucide="plus" class="w-4 h-4 mr-1"></i><span>Thêm Website & Khách Hàng</span>
                                </button>

                                <!-- Server Webserver Badge (Tầng Server) -->
                                <div class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-800/80 text-slate-300 border border-slate-700/80 text-xs font-mono font-medium">
                                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span>{{ activeSystemWebserver === 'ols' ? 'OpenLiteSpeed' : 'Nginx OpenResty' }}</span>
                                </div>

                                <button v-if="!isWebUser && selectedDomainIds.length > 0" @click="handleBatchDeleteDomains()"
                                    class="px-3 py-2 rounded-xl text-xs font-semibold bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 transition flex items-center space-x-1.5">
                                    <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i><span>Xóa ({{ selectedDomainIds.length }})</span>
                                </button>
                            </div>

                            <!-- Right: Category Filter + Search Box -->
                            <div class="flex items-center gap-2">
                                <select v-model="domainCategoryFilter"
                                    class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-800/80 dark:border-slate-700 text-slate-300 dark:text-slate-200 text-xs focus:outline-none font-medium">
                                    <option value="all">All categories ({{ domains.filter(d => !d.is_system).length }})</option>
                                    <option value="active">Active websites</option>
                                    <option value="suspended">Suspended websites</option>
                                    <option value="system">App Hệ Thống ({{ domains.filter(d => d.is_system === 1 || d.is_system === true).length }})</option>
                                </select>

                                <div class="relative">
                                    <input type="text" v-model="domainSearchQuery" placeholder="Tìm kiếm tên miền hoặc ghi chú..."
                                        class="w-44 sm:w-56 px-3 py-2 pr-8 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-800/80 dark:border-slate-700 text-slate-300 dark:text-slate-200 text-xs focus:outline-none focus:border-blue-500 font-mono">
                                    <i data-lucide="search" class="w-3.5 h-3.5 absolute right-2.5 top-2.5 text-slate-400"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Empty State khi chưa có website -->
                        <div v-if="filteredDomains.length === 0" class="wp-card p-12 text-center border border-slate-800/80 dark:bg-[#121622] rounded-2xl shadow-sm">
                            <div class="w-12 h-12 mx-auto rounded-xl bg-slate-800/80 border border-slate-700/80 text-slate-400 flex items-center justify-center mb-3"><i data-lucide="globe" class="w-6 h-6"></i></div>
                            <h3 class="text-base font-bold text-white">{{ domainCategoryFilter === 'system' ? 'Chưa Có App Hệ Thống Nào' : 'Chưa Có Website Nào' }}</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 max-w-sm mx-auto leading-relaxed">
                                {{ domainCategoryFilter === 'system' ? 'Cài đặt App Hệ Thống (như phpMyAdmin, Roundcube) từ App Store để quản lý tại đây.' : 'Hãy bắt đầu bằng cách thêm website đầu tiên hoặc kiểm tra bộ lọc tìm kiếm.' }}
                            </p>
                            <button v-if="domainCategoryFilter !== 'system'" @click="showAddDomainModal = true" class="mt-4 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white shadow-sm">
                                + Thêm Website Ngay
                            </button>
                            <button v-else @click="currentTab = 'apps'" class="mt-4 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 font-bold text-xs text-white shadow-sm">
                                ⚡ Đến Cửa Hàng Ứng Dụng (App Store)
                            </button>
                        </div>

                        <!-- BẢNG DANH SÁCH DOMAIN CLEAN TABLE (Chuẩn phong cách Modern Dark Table như ảnh tham chiếu) -->
                        <div v-else class="overflow-x-auto rounded-2xl border border-slate-800/80 bg-slate-900/60 shadow-sm">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-900/80 border-b border-slate-800/80 text-[11px] font-bold text-slate-500 dark:text-slate-400 tracking-wider">
                                    <th class="py-2.5 px-2 w-8 text-center">
                                        <input type="checkbox" @change="toggleSelectAllDomains" :checked="isAllDomainsSelected" class="rounded text-blue-400 border-slate-300 dark:border-slate-700 bg-slate-900/60 dark:bg-slate-800 cursor-pointer">
                                    </th>
                                    <th class="py-2.5 px-2">Site name ↓</th>
                                    <th class="py-2.5 px-1 w-20 text-center">Login</th>
                                    <th class="py-2.5 px-1 w-20 text-center">Status ↓</th>
                                    <th class="py-2.5 px-1 w-24 text-center">Package</th>
                                    <th class="py-2.5 px-1 w-[70px] text-center">CPU</th>
                                    <th class="py-2.5 px-1 w-[70px] text-center">RAM</th>
                                    <th class="py-2.5 px-1 w-[70px] text-center">Disk</th>
                                    <th class="py-2.5 px-1 w-14 text-center">SSL</th>
                                    <th class="py-2.5 px-1 w-20 text-center">Backend</th>
                                    <th class="py-2.5 px-1 w-12 text-center">DB</th>
                                    <th class="py-2.5 px-2 w-36 text-right">Operate</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 dark:divide-[#181f2c]">
                                <tr v-for="(d, idx) in filteredDomains" :key="d.id" class="hover:bg-slate-900/60/80 dark:hover:bg-slate-800/30 transition">
                                    <!-- Checkbox -->
                                    <td class="py-2.5 px-2 text-center w-8">
                                        <input type="checkbox" :value="d.id" v-model="selectedDomainIds" class="rounded text-blue-400 border-slate-300 dark:border-slate-700 bg-slate-900/60 dark:bg-slate-800 cursor-pointer">
                                    </td>

                                    <!-- Site name -->
                                    <td class="py-2.5 px-2 min-w-0">
                                        <div class="flex flex-col min-w-0 max-w-[170px]">
                                            <div class="flex items-center gap-1 min-w-0">
                                                <a :href="'http://' + (d.is_system && d.domain_name.endsWith('.sys') ? (currentHostName + ':888') : d.domain_name)" target="_blank"
                                                    class="font-bold text-xs text-slate-100 hover:text-blue-400 transition flex items-center gap-1 truncate" :title="d.domain_name">
                                                    <span class="truncate">{{ d.domain_name }}</span>
                                                    <i data-lucide="external-link" class="w-2.5 h-2.5 text-slate-400 shrink-0"></i>
                                                </a>
                                                <button v-if="!d.is_system" @click="openRenameDomainModal(d)" title="Đổi tên miền (Rename Domain)"
                                                    class="text-slate-500 hover:text-indigo-400 p-0.5 rounded transition shrink-0">
                                                    <i data-lucide="refresh-cw" class="w-2.5 h-2.5"></i>
                                                </button>
                                            </div>
                                            <div class="flex items-center gap-1.5 mt-0.5">
                                                <span class="text-[10px] text-slate-400 font-mono truncate">
                                                    {{ d.owner_username || d.domain_name.replace(/[^a-z0-9]/g, '').slice(0, 16) }}
                                                </span>
                                                <span class="inline-flex items-center px-1 rounded text-[9px] font-mono font-bold"
                                                    :class="d.webserver === 'nginx' ? 'bg-emerald-500/10 text-emerald-400 border border-blue-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'">
                                                    {{ (d.webserver || 'ols').toUpperCase() }}
                                                </span>
                                            </div>
                                        </div>
                                    </td>

                                    <!-- Login Column -->
                                    <td class="py-2 px-1 text-center w-20">
                                        <a v-if="d.is_system && d.domain_name.endsWith('.sys')" :href="'http://' + currentHostName + ':888'" target="_blank"
                                            title="Đăng nhập quản trị ứng dụng hệ thống"
                                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#1a3a5c] hover:bg-[#2b6cb0] text-sky-300 hover:text-white border border-sky-700/50 hover:border-sky-500 transition shadow-sm">
                                            <i data-lucide="log-in" class="w-3 h-3"></i>
                                            <span>Login</span>
                                        </a>
                                        <button v-else @click="impersonateWebsiteUser(d)" title="Đăng nhập quản trị website (Login As)"
                                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-semibold bg-[#1a3a5c] hover:bg-[#2b6cb0] text-sky-300 hover:text-white border border-sky-700/50 hover:border-sky-500 transition shadow-sm">
                                            <i data-lucide="log-in" class="w-3 h-3"></i>
                                            <span>Login</span>
                                        </button>
                                    </td>

                                        <!-- Status -->
                                        <td class="py-2.5 px-1 text-center w-20">
                                            <button @click="handleToggleDomainStatus(d)" :title="d.status === 'suspended' ? 'Bấm để Mở Khóa (Active)' : 'Bấm để Tạm Khóa (Suspend)'"
                                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full transition cursor-pointer text-[10px] font-semibold"
                                                :class="d.status === 'suspended' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/30' : 'bg-emerald-500/10 text-emerald-400 border border-blue-500/30'">
                                                <span class="w-1.5 h-1.5 rounded-full" :class="d.status === 'suspended' ? 'bg-rose-400' : 'bg-emerald-400 animate-pulse'"></span>
                                                <span>{{ d.status === 'suspended' ? 'Suspended' : 'Active' }}</span>
                                            </button>
                                        </td>

                                        <!-- Package -->
                                        <td class="py-2.5 px-1 text-center w-24">
                                            <span v-if="isWebUser" :title="d.plan_name"
                                                class="px-2 py-0.5 rounded-md text-[10px] font-mono font-medium bg-slate-100 dark:bg-slate-800/80 text-slate-500 dark:text-slate-400 border border-slate-200 dark:border-slate-700 truncate max-w-[90px] inline-block cursor-default">
                                                {{ d.plan_name || 'Mặc định' }}
                                            </span>
                                            <button v-else @click="openChangeDomainPlanModal(d)" title="Bấm để đổi Website Package"
                                                class="px-2 py-0.5 rounded-md text-[10px] font-mono font-medium bg-slate-100 dark:bg-slate-800/80 text-blue-600 dark:text-blue-400 border border-slate-800/80 dark:border-slate-700 hover:border-amber-400 transition truncate max-w-[90px] inline-block">
                                                {{ d.plan_name || 'Website Starter' }}
                                            </button>
                                        </td>

                                        <!-- CPU Donut Chart Gauge -->
                                        <td class="py-2 px-1 text-center w-[70px]">
                                            <div class="flex flex-col items-center gap-0.5">
                                                <div class="relative w-9 h-9 flex items-center justify-center cursor-pointer"
                                                    :title="(d.cpu_usage_pct || 0).toFixed(1) + '% / ' + (d.cpu_pct || 100) + '%'">
                                                    <svg class="absolute inset-0 w-9 h-9 -rotate-90 transform" viewBox="0 0 36 36">
                                                        <circle cx="18" cy="18" r="15.9155" fill="none" class="stroke-slate-200 dark:stroke-[#222a38]" stroke-width="4" />
                                                        <circle cx="18" cy="18" r="15.9155" fill="none"
                                                            :class="Math.min(100, Math.round(((d.cpu_usage_pct || 0) / (d.cpu_pct || 100)) * 100)) >= 85 ? 'stroke-rose-400' : Math.min(100, Math.round(((d.cpu_usage_pct || 0) / (d.cpu_pct || 100)) * 100)) >= 60 ? 'stroke-amber-400' : 'stroke-sky-400'"
                                                            stroke-width="4" stroke-linecap="round"
                                                            :stroke-dasharray="Math.min(100, Math.max(0, Math.round(((d.cpu_usage_pct || 0) / (d.cpu_pct || 100)) * 100))) + ', 100'" />
                                                    </svg>
                                                    <span class="relative text-[9px] font-bold font-mono leading-none"
                                                        :class="Math.min(100, Math.round(((d.cpu_usage_pct || 0) / (d.cpu_pct || 100)) * 100)) >= 85 ? 'text-rose-400' : Math.min(100, Math.round(((d.cpu_usage_pct || 0) / (d.cpu_pct || 100)) * 100)) >= 60 ? 'text-amber-400' : 'text-sky-400'">
                                                        {{ Math.min(100, Math.round(((d.cpu_usage_pct || 0) / (d.cpu_pct || 100)) * 100)) }}%
                                                    </span>
                                                </div>
                                                <span class="text-[9px] font-mono text-slate-400 leading-none whitespace-nowrap">
                                                    {{ (d.cpu_usage_pct || 0).toFixed(0) }}/{{ d.cpu_pct || 100 }}%
                                                </span>
                                            </div>
                                        </td>

                                        <!-- RAM Donut Chart Gauge -->
                                        <td class="py-2 px-1 text-center w-[70px]">
                                            <div class="flex flex-col items-center gap-0.5">
                                                <div class="relative w-9 h-9 flex items-center justify-center cursor-pointer"
                                                    :title="Math.round(d.mem_usage_mb || 0) + 'M / ' + (d.mem_mb || 1024) + 'M'">
                                                    <svg class="absolute inset-0 w-9 h-9 -rotate-90 transform" viewBox="0 0 36 36">
                                                        <circle cx="18" cy="18" r="15.9155" fill="none" class="stroke-slate-200 dark:stroke-[#222a38]" stroke-width="4" />
                                                        <circle cx="18" cy="18" r="15.9155" fill="none"
                                                            :class="Math.min(100, Math.round(((d.mem_usage_mb || 0) / (d.mem_mb || 1024)) * 100)) >= 85 ? 'stroke-rose-400' : Math.min(100, Math.round(((d.mem_usage_mb || 0) / (d.mem_mb || 1024)) * 100)) >= 60 ? 'stroke-amber-400' : 'stroke-violet-400'"
                                                            stroke-width="4" stroke-linecap="round"
                                                            :stroke-dasharray="Math.min(100, Math.max(0, Math.round(((d.mem_usage_mb || 0) / (d.mem_mb || 1024)) * 100))) + ', 100'" />
                                                    </svg>
                                                    <span class="relative text-[9px] font-bold font-mono leading-none"
                                                        :class="Math.min(100, Math.round(((d.mem_usage_mb || 0) / (d.mem_mb || 1024)) * 100)) >= 85 ? 'text-rose-400' : Math.min(100, Math.round(((d.mem_usage_mb || 0) / (d.mem_mb || 1024)) * 100)) >= 60 ? 'text-amber-400' : 'text-violet-400'">
                                                        {{ Math.min(100, Math.round(((d.mem_usage_mb || 0) / (d.mem_mb || 1024)) * 100)) }}%
                                                    </span>
                                                </div>
                                                <span class="text-[9px] font-mono text-slate-400 leading-none whitespace-nowrap">
                                                    {{ Math.round(d.mem_usage_mb || 0) }}M/{{ d.mem_mb || 1024 }}M
                                                </span>
                                            </div>
                                        </td>

                                        <!-- Disk Donut Chart Gauge -->
                                        <td class="py-2 px-1 text-center w-[70px]">
                                            <div class="flex flex-col items-center gap-0.5">
                                                <div class="relative w-9 h-9 flex items-center justify-center cursor-pointer"
                                                    :title="((d.disk_usage_mb || 0)/1024).toFixed(1) + 'G / ' + ((d.disk_mb || 5120)/1024).toFixed(0) + 'G'">
                                                    <svg class="absolute inset-0 w-9 h-9 -rotate-90 transform" viewBox="0 0 36 36">
                                                        <circle cx="18" cy="18" r="15.9155" fill="none" class="stroke-slate-200 dark:stroke-[#222a38]" stroke-width="4" />
                                                        <circle cx="18" cy="18" r="15.9155" fill="none"
                                                            :class="Math.min(100, Math.round(((d.disk_usage_mb || 0) / (d.disk_mb || 5120)) * 100)) >= 85 ? 'stroke-rose-400' : Math.min(100, Math.round(((d.disk_usage_mb || 0) / (d.disk_mb || 5120)) * 100)) >= 60 ? 'stroke-amber-400' : 'stroke-emerald-400'"
                                                            stroke-width="4" stroke-linecap="round"
                                                            :stroke-dasharray="Math.min(100, Math.max(0, Math.round(((d.disk_usage_mb || 0) / (d.disk_mb || 5120)) * 100))) + ', 100'" />
                                                    </svg>
                                                    <span class="relative text-[9px] font-bold font-mono leading-none"
                                                        :class="Math.min(100, Math.round(((d.disk_usage_mb || 0) / (d.disk_mb || 5120)) * 100)) >= 85 ? 'text-rose-400' : Math.min(100, Math.round(((d.disk_usage_mb || 0) / (d.disk_mb || 5120)) * 100)) >= 60 ? 'text-amber-400' : 'text-emerald-400'">
                                                        {{ Math.min(100, Math.round(((d.disk_usage_mb || 0) / (d.disk_mb || 5120)) * 100)) }}%
                                                    </span>
                                                </div>
                                                <span class="text-[9px] font-mono text-slate-400 leading-none whitespace-nowrap">
                                                    {{ ((d.disk_usage_mb || 0)/1024).toFixed(1) }}G/{{ ((d.disk_mb || 5120)/1024).toFixed(0) }}G
                                                </span>
                                            </div>
                                        </td>

                                        <!-- SSL Column -->
                                        <td class="py-2 px-1 text-center w-14">
                                            <button @click="openSslModal(d)" :title="d.ssl_enabled ? 'SSL Active \u2013 Bấm để quản lý' : 'Chưa có SSL \u2013 Bấm để cài'"
                                                class="inline-flex flex-col items-center gap-0.5 cursor-pointer transition">
                                                <i :data-lucide="d.ssl_enabled ? 'shield-check' : 'shield-off'" class="w-4 h-4" :class="d.ssl_enabled ? 'text-emerald-400' : 'text-slate-500'"></i>
                                                <span class="text-[9px] font-mono leading-none"
                                                    :class="d.ssl_enabled ? 'text-emerald-400' : 'text-rose-400'">
                                                    {{ d.ssl_enabled ? 'Active' : 'None' }}
                                                </span>
                                            </button>
                                        </td>

                                        <!-- Backend (PHP Version) Column -->
                                        <td class="py-2 px-1 text-center w-20">
                                            <button @click="openChangePhpModal(d)" title="Bấm để đổi phiên bản PHP"
                                                class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md font-mono text-[10px] font-bold bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 hover:text-emerald-300 border border-blue-500/30 hover:border-emerald-400 transition">
                                                <span>PHP</span>
                                                <span>{{ d.php_version || '8.2' }}</span>
                                            </button>
                                        </td>

                                        <!-- Database -->
                                        <td class="py-2.5 px-1 text-center w-12">
                                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-100 dark:bg-slate-800 text-slate-300 dark:text-slate-300 border border-slate-800/80 dark:border-slate-700">
                                                <i data-lucide="folder" class="w-3.5 h-3.5 text-slate-400"></i>
                                                <span>{{ d.db_count || 0 }}</span>
                                            </span>
                                        </td>

                                        <!-- Operate (Joined Button Group) -->
                                        <td class="py-2.5 px-2 text-right w-44">
                                            <div class="inline-flex rounded-md overflow-hidden border border-slate-700/80 shadow-sm shrink-0">
                                                <!-- WordPress Manager Button -->
                                                <button type="button" v-if="!d.is_system" @click="openDomainWp(d)" title="Quản trị WordPress Manager (8 Tabs, Direct ZIP, Lockdown, Magic Login SSO)"
                                                    class="w-8 h-8 bg-blue-600 hover:bg-blue-500 text-white flex items-center justify-center transition font-bold text-xs cursor-pointer"
                                                    style="padding: 0;">
                                                    W
                                                </button>
                                                <!-- Conf: Chỉ Admin mới có quyền mở VHost cấu hình trực tiếp -->
                                                <button type="button" v-if="currentUser.role === 'admin'" @click="openDomainVhostModal(d)" title="Cấu hình Webserver VirtualHost (Nginx / OpenLiteSpeed) (Chỉ Admin)"
                                                    class="w-8 h-8 bg-amber-500 hover:bg-amber-600 text-white flex items-center justify-center transition cursor-pointer"
                                                    style="padding: 0;">
                                                    <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 pointer-events-none"></i>
                                                </button>
                                                <!-- Rename Domain Button -->
