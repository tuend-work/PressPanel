# ==============================================================================
# WPCloud Control Panel Master Configuration File (wpc.conf)
# Tương đương directadmin.conf của DirectAdmin
# Vị trí trên máy chủ: /opt/wpc/conf/wpc.conf
# Phân quyền khuyến nghị: chmod 640 root:wpc
# ==============================================================================

# --- MẠNG & CỔNG KẾT NỐI (SERVER & NETWORKING) ---
port=8888
bind_address=0.0.0.0
servername=localhost
session_timeout=60
access_token_expire_days=7

# --- BẢO MẬT SSL / TLS PANEL ---
# 1: Kích hoạt HTTPS cho Web Panel; 0: Chạy HTTP thường
ssl=0
ssl_cert=/opt/wpc/data/ssl/panel.crt
ssl_key=/opt/wpc/data/ssl/panel.key

# --- BẢO MẬT & CHỐNG TẤN CÔNG (SECURITY & HARDENING) ---
secret_key=wpc-secret-token-key-change-me-in-production
max_login_attempts=5
login_lockout_seconds=900
allow_subnets=0.0.0.0/0
enable_rate_limit=1
rate_limit_requests=100
rate_limit_window_seconds=60

# --- DỊCH VỤ WEB MẶC ĐỊNH (DEFAULT WEBSERVER & RUNTIME) ---
# Tùy chọn: ols (OpenLiteSpeed) hoặc nginx
default_webserver=ols
# Phiên bản PHP mặc định khi tạo website: 7.4, 8.1, 8.2, 8.3, 8.4
default_php=8.2
# Cổng quản trị OpenLiteSpeed WebAdmin
ols_admin_port=7080

# --- CƠ SỞ DỮ LIỆU MARIADB / MYSQL ---
mysql_host=localhost
mysql_port=3306
mysql_socket=/var/run/mysqld/mysqld.sock

# --- GIỚI HẠN TÀI NGUYÊN MẶC ĐỊNH (DEFAULT RESOURCE LIMITS) ---
# CPU % (100 = 1 Core)
default_cpu_pct=100
# RAM tối đa (MB)
default_mem_mb=1024
# Dung lượng ổ cứng mặc định (MB)
default_disk_mb=5120
# Số tiến trình tối đa (Cgroups v2 PIDs)
default_pids_max=100
# Trọng số I/O
default_io_weight=100

# --- HỆ THỐNG ĐƯỜNG DẪN (SYSTEM PATHS) ---
base_dir=/opt/wpc
bin_dir=/opt/wpc/bin
data_dir=/opt/wpc/data
logs_dir=/opt/wpc/logs
scripts_dir=/opt/wpc/scripts
templates_dir=/opt/wpc/templates
static_dir=/opt/wpc/static
database_path=/opt/wpc/data/panel.db

# --- TÍNH NĂNG NÂNG CAO (ADVANCED ENGINE FEATURES) ---
# 1: Bật lồng cách ly Linux Namespace Cage; 0: Tắt (chỉ dùng cho debug)
enable_cage=1
# 1: Bật Cgroups v2 phân cấp quản trị tài nguyên; 0: Tắt
enable_cgroup=1
# 1: Bật Filesystem Quota (ext4/xfs) kiểm soát dung lượng ổ cứng; 0: Tắt
enable_disk_quota=1
# 1: Tự động gia hạn chứng chỉ Let's Encrypt SSL qua background cron; 0: Tắt
auto_renew_ssl=1
# Thư mục chứa các bản sao lưu
backup_storage_path=/opt/wpc/data/backups

# --- CẤP ĐỘ GHI NHẬT KÝ (LOGGING) ---
# Tùy chọn: debug, info, warning, error
log_level=info
log_file=/opt/wpc/logs/wpc.log
